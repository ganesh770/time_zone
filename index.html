<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Countries | Time Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  color: white;
}

/* Background */
#bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=60");
  background-size: cover;
  background-position: center;
}

/* Overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

/* Card */
.card {
  position: relative;
  z-index: 2;
  width: 360px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  padding: 30px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  text-align: center;
}

h1 {
  margin-bottom: 10px;
}

select {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}

/* Button */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

/* Popular links */
.links {
  margin-top: 20px;
  font-size: 13px;
}

.links a {
  display: block;
  color: #9ca3af;
  margin: 5px 0;
  text-decoration: none;
}
</style>
</head>

<body>

<div id="bg"></div>
<div class="overlay"></div>

<div class="card">

  <h1>Select Countries</h1>
  <p>Find best meeting time instantly</p>

  <select id="from">
    <option value="india">🇮🇳 India</option>
    <option value="usa">🇺🇸 USA</option>
    <option value="uk">🇬🇧 UK</option>
  </select>

  <select id="to">
    <option value="usa">🇺🇸 USA</option>
    <option value="india">🇮🇳 India</option>
    <option value="uk">🇬🇧 UK</option>
  </select>

  <button onclick="go()">Find Time</button>

  <div class="links">
    🔥 Popular:
    <a href="india-to-usa.html">India → USA</a>
    <a href="india-to-uk.html">India → UK</a>
    <a href="usa-to-india.html">USA → India</a>
  </div>

</div>

<script>
function go() {
  let from = document.getElementById("from").value;
  let to = document.getElementById("to").value;

  if (from === to) {
    alert("Select different countries");
    return;
  }

  // Redirect to page
  window.location.href = `${from}-to-${to}.html`;
}
</script>

</body>
</html>
