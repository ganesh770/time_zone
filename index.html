<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoLink | Global Time Explorer</title>
    <meta name="description" content="Premium universal time zone planner. Coordinate across 198+ countries with dynamic day/night visuals and smart meeting windows.">
    
    <!-- Meta Tags for SEO -->
    <meta property="og:title" content="ChronoLink | Global Time Explorer">
    <meta property="og:description" content="Plan meetings across the world with beautiful, time-adaptive visuals.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Luxon for Timezones -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    
    <!-- Countries and Timezones library -->
    <script src="https://cdn.jsdelivr.net/gh/manuelmhtr/countries-and-timezones@latest/dist/index.min.js"></script>
    
    <!-- Slim Select CSS -->
    <link href="https://cdn.jsdelivr.net/npm/slim-select@latest/dist/slimselect.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background Layers -->
    <div id="bg-active" class="bg-layer"></div>
    <div id="bg-next" class="bg-layer"></div>
    <div class="overlay"></div>

    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <main class="main-card">
            <header class="header">
                <h1>ChronoLink</h1>
                <p class="subtitle">Visual Time Coordination</p>
            </header>

            <div class="time-grid">
                <div class="time-box">
                    <img id="flag-home" src="" alt="" class="flag-icon">
                    <div class="time-label" id="label-home">Home</div>
                    <div class="time-value" id="time-home">--:--</div>
                </div>
                <div class="time-box">
                    <img id="flag-target" src="" alt="" class="flag-icon">
                    <div class="time-label" id="label-target">Target</div>
                    <div class="time-value" id="time-target">--:--</div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="select-home">Home Base</label>
                    <select id="select-home"></select>
                </div>
                <div class="input-group">
                    <label for="select-target">Target Destination</label>
                    <select id="select-target"></select>
                </div>
            </div>

            <div class="slider-section">
                <div class="slider-info">
                    <span>12 AM</span>
                    <span id="slider-current-val" style="color: #fff; font-weight: 600;">--:--</span>
                    <span>12 AM</span>
                </div>
                <input type="range" id="time-slider" min="0" max="1439" value="720">
            </div>

            <div id="status-badge" class="status-badge">
                Analyzing window...
            </div>
        </main>
    </div>

    <!-- Slim Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/slim-select@latest/dist/slimselect.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
