<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real Sky Time Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  color: white;
}

/* Background layers */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  transition: opacity 1s ease;
}

#bg1 { z-index: 0; }
#bg2 { z-index: 0; }

/* Overlay for readability */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 1;
}

/* Stars overlay */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 1;
}

/* Card UI */
.card {
  position: relative;
  z-index: 2;
  width: 360px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  padding: 30px;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  text-align: center;
}

.countries {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

input[type=range] {
  width: 100%;
  margin: 20px 0;
}

.time {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.status {
  margin-top: 15px;
  font-weight: 500;
}
</style>
</head>

<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>

<div class="overlay"></div>
<div id="stars" class="stars"></div>

<div class="card">
  <div class="countries">
    <div>🇮🇳 India</div>
    <div>🇺🇸 USA</div>
  </div>

  <p>Drag IST time</p>

  <input type="range" min="0" max="23" value="12" id="slider">

  <div class="time">
    <span>IST</span>
    <span id="istTime"></span>
  </div>

  <div class="time">
    <span>PST</span>
    <span id="pstTime"></span>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
const slider = document.getElementById("slider");
const stars = document.getElementById("stars");

/* HIGH QUALITY REAL IMAGES */
const images = {
  sunrise: "https://images.unsplash.com/photo-1500534623283-312aade485b7",
  morning: "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
  afternoon: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
  sunset: "https://images.unsplash.com/photo-1501973801540-537f08ccae7b",
  night: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564"
};

let currentBg = document.getElementById("bg1");
let nextBg = document.getElementById("bg2");

function setBackground(url) {
  nextBg.style.backgroundImage = `url(${url})`;
  nextBg.style.opacity = 1;
  currentBg.style.opacity = 0;

  let temp = currentBg;
  currentBg = nextBg;
  nextBg = temp;
}

function update() {
  let ist = parseInt(slider.value);
  let pst = (ist - 13 + 24) % 24;

  document.getElementById("istTime").innerText = ist + ":00";
  document.getElementById("pstTime").innerText = pst + ":00";

  // Meeting logic
  if (pst >= 9 && pst <= 17) {
    document.getElementById("status").innerText = "✔ Ideal Meeting Time";
  } else {
    document.getElementById("status").innerText = "✖ Outside Working Hours";
  }

  // Background + stars
  if (ist >= 5 && ist < 8) {
    setBackground(images.sunrise);
    stars.style.opacity = 0;
  }
  else if (ist >= 8 && ist < 12) {
    setBackground(images.morning);
    stars.style.opacity = 0;
  }
  else if (ist >= 12 && ist < 17) {
    setBackground(images.afternoon);
    stars.style.opacity = 0;
  }
  else if (ist >= 17 && ist < 20) {
    setBackground(images.sunset);
    stars.style.opacity = 0;
  }
  else {
    setBackground(images.night);
    stars.style.opacity = 0.7; // stars visible
  }
}

slider.addEventListener("input", update);
update();
</script>

</body>
</html>
