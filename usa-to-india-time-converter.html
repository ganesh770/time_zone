<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USA to India Time Converter | US Time to IST</title>

    <meta name="description"
        content="Convert USA time to India time instantly. Compare US and India working hours with live slider conversion.">

    <link rel="canonical" href="https://time-zone-wheat.vercel.app/usa-to-india-time-converter.html">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #4f46e5, #0f172a 40%),
                radial-gradient(circle at bottom right, #06b6d4, #111827 35%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .hero {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
        }

        .hero p {
            color: #cbd5e1;
            margin-top: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 35px;
        }

        .stats,
        .time-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box,
        .time-card {
            background: rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }

        .time-card:first-child p {
            color: #38bdf8;
        }

        .time-card:last-child p {
            color: #c084fc;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 20px;
        }

        .cta-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="hero">
            <h1>USA → India Time Converter</h1>
            <p>Compare USA and India working hours instantly</p>
        </div>

        <div class="card">

            <div class="stats">
                <div class="stat-box">
                    <h3>Popular US Zone</h3>
                    <p>EST</p>
                </div>

                <div class="stat-box">
                    <h3>Best Meeting Window</h3>
                    <p>8AM – 12PM EST</p>
                </div>
            </div>

            <h2 style="text-align:center;">Live Time Conversion</h2>

            <input type="range" min="0" max="23" value="12" id="slider">

            <div class="time-display">
                <div class="time-card">
                    <h3>USA (EST)</h3>
                    <p id="usaTime">12:00</p>
                </div>

                <div class="time-card">
                    <h3>India (IST)</h3>
                    <p id="istTime">10:30</p>
                </div>
            </div>

            <a href="/" class="cta-btn">Use Full Interactive Planner</a>

        </div>
    </div>

    <script>
        const slider = document.getElementById("slider");
        const usaTime = document.getElementById("usaTime");
        const istTime = document.getElementById("istTime");

        function updateTime() {
            let usa = parseInt(slider.value);
            let istHour = usa + 10;

            if (istHour >= 24) { istHour -= 24; }

            usaTime.innerText = String(usa).padStart(2, '0') + ":00";
            istTime.innerText = String(istHour).padStart(2, '0') + ":30";
        }

        slider.addEventListener("input", updateTime);
        updateTime();
    </script>

</body>

</html>
